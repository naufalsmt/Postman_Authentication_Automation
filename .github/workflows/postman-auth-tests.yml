
name: Postman Authentication API Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  authentication-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Newman
        run: npm install -g newman

      - name: Run Postman Authentication Tests
        env:
          API_KEY: ${{ secrets.API_KEY }}
          LOGIN_PASSWORD: ${{ secrets.LOGIN_PASSWORD }}
          VALID_TOKEN_PWD: ${{ secrets.VALID_TOKEN_PWD }}
          INVALID_TOKEN_PWD: ${{ secrets.INVALID_TOKEN_PWD }}
        run: |
          newman run "collections/Postman Authentication Automation.postman_collection.json" \
            --env-var "api_key=$API_KEY" \
            --env-var "login_password=$LOGIN_PASSWORD" \
            --env-var "valid_token_pwd=$VALID_TOKEN_PWD" \
            --env-var "invalid_token_pwd=$INVALID_TOKEN_PWD"
